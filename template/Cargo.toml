[package]
name = "ootle_gig"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OotleGig: escrowed micro-jobs with verifiable delivery receipts on Tari Ootle"

[dependencies]
tari_template_lib = { version = "0.38", features = ["serde"] }
minicbor = { version = "2.3", features = ["derive"] }

[dev-dependencies]
# Version pins for a self-consistent 0.50-era test stack: tari_engine 0.50.x calls
# tari_bor::count_data_items_bounded and converts its error into BorError, which
# only works with tari_bor 0.17.1 — 0.17.2 changed that function's error type to
# ItemCountError (no conversion exists), so the engine no longer compiles against
# it. tari_engine is pinned to 0.50.0, the version the test tooling shipped with.
tari_engine = "=0.50.0"
tari_bor = "=0.17.1"
tari_template_test_tooling = "0.50"
tari_ootle_transaction = "0.50"
tari_template_lib_types = "0.37"
tari_crypto = "0.24"
tari_ootle_common_types = "0.50"
ootle_byte_type = "0.19"

[lib]
crate-type = ["cdylib", "lib"]
